<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NanoVLA Studio</title>
<style>
/* Layout: left rail = the 4-step workflow (where am I, what is next); one focused workspace; activity bar at the top
   shows running jobs from anywhere. Spacing scale 4/8/12/16/24/32, type scale 12/13/14/16/20/24. */
:root {
  --bg:#f4f4f4; --surface:#ffffff; --sunken:#ededed; --fg:#111111; --mut:#555555; --faint:#8c8c8c; --line:#dcdcdc;
  --acc:#111111; --acc-fg:#ffffff; --acc-soft:#e9e9e9; --warn:#333333; --warn-soft:#f1f1f1; --bad:#000000; --bad-soft:#e6e6e6;
  --r:10px; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg:#0c0c0c; --surface:#161616; --sunken:#1f1f1f; --fg:#f2f2f2; --mut:#a8a8a8; --faint:#6e6e6e; --line:#2c2c2c;
  --acc:#f2f2f2; --acc-fg:#0c0c0c; --acc-soft:#262626; --warn:#d6d6d6; --warn-soft:#1c1c1c; --bad:#ffffff; --bad-soft:#2a2a2a; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color:var(--fg); }
button, input, select { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
[hidden] { display:none !important; }

/* ---------- shell */
.shell { display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh; }
.rail { background:var(--surface); border-right:1px solid var(--line); padding:20px 12px; display:flex; flex-direction:column; gap:20px; position:sticky; top:0; height:100vh; }
.brand { padding:0 8px; } .brand b { font-size:16px; letter-spacing:.01em; display:block; } .brand span { font-size:12px; color:var(--mut); }
.steps { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.steps a { display:grid; grid-template-columns:28px 1fr; gap:10px; align-items:center; padding:9px 8px; border-radius:8px; text-decoration:none; color:var(--fg); }
.steps a:hover { background:var(--sunken); }
.steps a[aria-current="page"] { background:var(--acc-soft); }
.steps .n { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font:600 12px var(--mono); border:1.5px solid var(--line); color:var(--mut); background:var(--surface); }
.steps a[aria-current="page"] .n { border-color:var(--acc); color:var(--acc); }
.steps .n.done { background:var(--acc); border-color:var(--acc); color:var(--acc-fg); }
.steps .t { font-weight:600; font-size:13.5px; line-height:1.25; min-width:0; } .steps .s { display:block; font-weight:400; font-size:12px; color:var(--mut); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rail .sep { border-top:1px solid var(--line); margin:0 8px; }
.sys { padding:0 8px; display:flex; flex-direction:column; gap:8px; font-size:12.5px; }
.sys div { display:flex; align-items:center; gap:8px; color:var(--mut); }
.dot { width:8px; height:8px; border-radius:50%; background:var(--faint); flex:none; }
.dot { border:1.5px solid var(--faint); background:none; } .dot.ok { background:var(--fg); border-color:var(--fg); } .dot.warn { border-color:var(--fg); border-style:dashed; } .dot.bad { border-color:var(--fg); background:repeating-linear-gradient(45deg, var(--fg) 0 2px, transparent 2px 4px); }
.rail .foot { margin-top:auto; padding:0 8px; font-size:12.5px; }

.top { display:flex; align-items:center; gap:12px; min-height:56px; padding:8px max(24px, env(safe-area-inset-right)) 8px 28px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:5; }
.top h1 { font-size:17px; margin:0; font-weight:650; }
.activity { margin-left:auto; display:flex; align-items:center; gap:10px; background:none; border:1px solid var(--line); border-radius:99px; padding:6px 14px 6px 12px; cursor:pointer; font-size:13px; color:var(--mut); }
.activity.live { border-color:var(--fg); color:var(--fg); }
.activity .bar { width:72px; height:5px; border-radius:3px; background:var(--sunken); overflow:hidden; } .activity .bar i { display:block; height:100%; background:var(--fg); width:0; }
.work { padding:28px max(24px, env(safe-area-inset-right)) 56px 28px; max-width:960px; }
.lead { color:var(--mut); margin:0 0 24px; max-width:64ch; }

/* ---------- components */
.panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); min-width:0; }
.stack > * + * { margin-top:16px; }
.ph { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
.ph h2 { font-size:15px; margin:0; } .ph p { margin:2px 0 0; color:var(--mut); font-size:13px; }
.pb { padding:20px; }
.fields { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px 20px; }
.fields .wide { grid-column:1 / -1; }
@media (max-width: 640px) { .fields { grid-template-columns:minmax(0,1fr); } }
.field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.field > span { font-size:13px; font-weight:600; } .field small { color:var(--mut); font-size:12px; }
input[type=text], input[type=number], select { width:100%; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-height:40px; }
input::placeholder { color:var(--faint); }
input[type=checkbox] { width:16px; height:16px; accent-color:var(--acc); }
.check { display:flex; align-items:center; gap:10px; font-size:13.5px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; min-height:40px; padding:0 16px; border-radius:8px; border:1px solid var(--line); background:var(--surface); font-weight:600; cursor:pointer; text-decoration:none; color:var(--fg); }
.btn:hover { border-color:var(--faint); }
.btn.primary { background:var(--acc); border-color:var(--acc); color:var(--acc-fg); }
.btn.primary:hover { opacity:.88; }
.btn.ghost { border-color:transparent; background:none; color:var(--mut); }
.btn.danger { color:var(--fg); border-color:var(--fg); }
.btn:disabled { opacity:.45; cursor:not-allowed; }
.actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:24px; }
.hint { color:var(--mut); font-size:13px; }
details.adv { margin-top:20px; border-top:1px solid var(--line); padding-top:14px; }
details.adv summary { cursor:pointer; color:var(--mut); font-size:13px; font-weight:600; list-style:none; } details.adv summary::-webkit-details-marker { display:none; }
details.adv summary::before { content:"▸ "; } details.adv[open] summary::before { content:"▾ "; }
details.adv .fields, details.adv > p { margin-top:14px; }
.badge { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px; background:var(--sunken); color:var(--mut); white-space:nowrap; }
.badge.ok { background:var(--acc); color:var(--acc-fg); } .badge.warn { background:none; color:var(--fg); border:1px dashed var(--fg); padding:1px 8px; } .badge.bad { background:none; color:var(--fg); border:1.5px solid var(--fg); padding:1px 8px; }
.badge.bad::before { content:"!"; font-weight:800; }
.note { padding:12px 14px; border-radius:8px; background:var(--sunken); color:var(--mut); font-size:13px; }
.note.warn, .note.bad { background:var(--surface); color:var(--fg); border:1px solid var(--line); border-left:3px solid var(--fg); }
.note.bad { font-weight:500; }
.list { display:flex; flex-direction:column; }
.item { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 16px; align-items:center; padding:14px 20px; border:0; border-top:1px solid var(--line); cursor:pointer; text-align:left; background:none; width:100%; }
.item:first-child { border-top:0; } .item:hover { background:var(--sunken); }
.item[aria-selected="true"] { background:var(--acc-soft); box-shadow:inset 3px 0 0 var(--fg); }
.item b { font-size:14px; overflow-wrap:anywhere; } .item .meta { color:var(--mut); font-size:12.5px; grid-column:1; }
.item .right { grid-row:1 / span 2; grid-column:2; display:flex; gap:6px; align-items:center; }
.split { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.2fr); gap:16px; align-items:start; }
@media (max-width: 880px) { .split { grid-template-columns:minmax(0,1fr); } }
@media (max-width: 760px) {
  .shell { grid-template-columns:minmax(0,1fr); }
  .rail { position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; gap:6px 12px; padding:10px 16px; border-right:0; border-bottom:1px solid var(--line); }
  .brand span, .steps .s, .rail .sep, .sys, .rail .foot { display:none; } .steps { flex-direction:row; flex-wrap:wrap; } .steps a { grid-template-columns:24px auto; gap:6px; padding:6px 8px; } .steps .n { width:22px; height:22px; }
  .top { position:static; padding-left:16px; } .work { padding:20px 16px 48px; } }
.kv { display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 16px; font-size:13px; margin:12px 0 0; } .kv dt { color:var(--mut); } .kv dd { margin:0; overflow-wrap:anywhere; }
.tasks { list-style:none; margin:0; padding:0; font-size:13.5px; } .tasks li { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line); } .tasks li:first-child { border-top:0; padding-top:0; }
.tasks .c { color:var(--mut); font-family:var(--mono); font-size:12px; white-space:nowrap; }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.empty { padding:40px 20px; text-align:center; color:var(--mut); } .empty b { display:block; color:var(--fg); font-size:15px; margin-bottom:4px; }
.flow { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12.5px; color:var(--mut); margin:8px 0 0; } .flow span { padding:3px 9px; border-radius:6px; background:var(--sunken); color:var(--fg); }
.metric { display:grid; grid-template-columns:130px minmax(0,1fr) 64px; gap:12px; align-items:center; font-size:13px; margin:10px 0; }
.metric .track { height:8px; background:var(--sunken); border-radius:4px; overflow:hidden; } .metric .track i { display:block; height:100%; border-radius:4px; background:var(--acc); }
.metric .track i.t { background:repeating-linear-gradient(90deg, var(--faint) 0 6px, transparent 6px 8px); } .metric .v { text-align:right; font-family:var(--mono); }
.timeline { list-style:none; margin:10px 0 0; padding:0; }
.timeline li { display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:10px; align-items:start; padding:6px 0; font-size:13.5px; }
.timeline .ic { width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line); margin-top:1px; display:grid; place-items:center; font-size:11px; font-weight:700; }
.timeline .done .ic { background:var(--acc); border-color:var(--acc); color:var(--acc-fg); }
.timeline .running .ic { border-color:var(--fg); border-top-color:transparent; animation:spin 1s linear infinite; }
.timeline .failed .ic { background:var(--surface); border:2px solid var(--fg); color:var(--fg); }
.timeline .pending { color:var(--faint); } .timeline .dur { color:var(--mut); font-family:var(--mono); font-size:12px; }
@keyframes spin { to { transform:rotate(360deg); } }
.prog { height:5px; border-radius:3px; background:var(--sunken); overflow:hidden; margin-top:6px; } .prog i { display:block; height:100%; background:var(--fg); }
pre.log { font:12px/1.5 var(--mono); background:var(--sunken); border-radius:8px; padding:12px; max-height:300px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; margin:12px 0 0; color:var(--mut); }
dialog { border:1px solid var(--line); border-radius:12px; padding:0; width:min(560px, calc(100vw - 32px)); background:var(--surface); color:var(--fg); }
dialog::backdrop { background:rgba(0,0,0,.5); }
dialog .pb { max-height:70vh; overflow:auto; }
dialog .df { display:flex; justify-content:flex-end; gap:10px; padding:14px 20px; border-top:1px solid var(--line); }
.drawer { position:fixed; top:0; right:0; height:100vh; width:min(440px, 100vw); background:var(--surface); border-left:1px solid var(--line); z-index:20; display:flex; flex-direction:column; box-shadow:-12px 0 32px rgba(0,0,0,.10); }
.drawer .ph { justify-content:space-between; } .drawer .body { overflow:auto; flex:1; }
.job { padding:16px 20px; border-top:1px solid var(--line); } .job:first-child { border-top:0; }
.job .row1 { display:flex; justify-content:space-between; gap:10px; align-items:center; } .job .row1 b { font-size:14px; }
.job .actions { margin-top:12px; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--fg); color:var(--bg); padding:10px 16px; border-radius:8px; font-size:13.5px; z-index:40; max-width:calc(100vw - 32px); }
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Quy trình">
    <div class="brand"><b>NanoVLA Studio</b><span>Dạy robot SO-101 tác vụ mới</span></div>
    <ol class="steps">
      <li><a href="#collect" data-step="collect"><span class="n">1</span><span class="t">Thu thập demo<span class="s" id="sub-collect">Ghi bằng tay leader</span></span></a></li>
      <li><a href="#data" data-step="data"><span class="n">2</span><span class="t">Chọn dataset<span class="s" id="sub-data">–</span></span></a></li>
      <li><a href="#distill" data-step="distill"><span class="n">3</span><span class="t">Distill<span class="s" id="sub-distill">Tạo model nhỏ</span></span></a></li>
      <li><a href="#models" data-step="models"><span class="n">4</span><span class="t">Model và chạy robot<span class="s" id="sub-models">–</span></span></a></li>
    </ol>
    <div class="sep"></div>
    <div class="sys" aria-label="Trạng thái hệ thống">
      <div><i class="dot" id="d-teacher"></i><span id="t-teacher">Model thầy</span></div>
      <div><i class="dot" id="d-gpu"></i><span id="t-gpu">GPU</span></div>
      <div><i class="dot" id="d-robot"></i><span id="t-robot">Robot</span></div>
    </div>
    <div class="foot"><a href="#settings">Cài đặt model thầy</a></div>
  </nav>

  <div>
    <div class="top">
      <h1 id="title">–</h1>
      <button class="activity" id="act" aria-controls="drawer" aria-expanded="false"><span id="act-t">Hoạt động</span><span class="bar" hidden><i></i></span></button>
    </div>
    <main class="work" id="work"></main>
  </div>
</div>

<aside class="drawer" id="drawer" hidden aria-label="Hoạt động">
  <div class="ph"><h2>Hoạt động</h2><button class="btn ghost" id="drawer-x">Đóng</button></div>
  <div class="body" id="drawer-body" aria-live="polite"></div>
</aside>

<dialog id="dlg"><form method="dialog"><div class="ph"><h2 id="dlg-title"></h2></div><div class="pb" id="dlg-body"></div><div class="df" id="dlg-foot"></div></form></dialog>
<div class="toast" id="toast" hidden role="status"></div>

<script>
// ------------------------------------------------------------------ state + helpers
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = (u, o) => fetch(u, o).then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Máy chủ không phản hồi (" + r.status + ")"); return j; });
const post = (u, b) => api(u, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(b || {})});
const S = { status:null, ds:[], models:[], jobs:[], sel:null, selModel:null, dsDetail:{} };
const KIND = {distill:"Distill", collect:"Thu thập demo", dagger:"Cải thiện model", teacher:"Train model thầy", import:"Tải dataset", run:"Chạy trên robot"};
const STAGE = {prepare:"Kiểm tra dataset", fewshot:"Dạy thầy tác vụ mới", eval_teacher:"Đánh giá thầy", label_train:"Thầy gán nhãn", label_test:"Chuẩn bị bộ kiểm tra",
  student:"Train model trò", package:"Đóng gói", record:"Ghi demo", robot:"Robot đang chạy", label_dagger:"Thầy sửa dữ liệu mới", download:"Tải về", prepare_import:"Chuẩn bị dataset",
  select:"Chọn dataset công khai", merge:"Gộp dataset", train:"Train thầy"};
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 4000); }
const dur = s => s < 60 ? Math.max(1, Math.round(s)) + " giây" : s < 3600 ? Math.round(s / 60) + " phút" : (s / 3600).toFixed(1).replace(".", ",") + " giờ";
const ago = t => { const s = Date.now() / 1000 - t; return s < 90 ? "vừa xong" : s < 3600 ? Math.round(s / 60) + " phút trước" : s < 86400 ? Math.round(s / 3600) + " giờ trước" : Math.round(s / 86400) + " ngày trước"; };
const nice = n => { const [o, r] = String(n).includes("__") ? String(n).split("__") : ["", n]; return {name:r, owner:o}; };
const deg = v => v == null ? "–" : v.toFixed(2).replace(".", ",") + "°";
function friendly(err) {
  const e = String(err || "");
  if (/could not open port|\/dev\/tty|SerialException/i.test(e)) return "Không mở được cổng robot. Kiểm tra cáp USB rồi chọn lại cổng.";
  if (/camera .* not available|VideoCapture|camera read failed/i.test(e)) return "Không đọc được camera. Kiểm tra số thứ tự camera.";
  if (/CUDA out of memory|OutOfMemory/i.test(e)) return "GPU hết bộ nhớ. Đợi tác vụ khác xong rồi chạy lại.";
  if (/one wrist camera and one overview camera/i.test(e)) return "Dataset cần đúng 2 camera: cổ tay và tổng quan.";
  if (/at least 2 episodes/i.test(e)) return "Mỗi câu lệnh cần ít nhất 2 demo (1 demo được giữ lại để kiểm tra).";
  if (/429|Too Many Requests/i.test(e)) return "Hugging Face đang giới hạn lượt tải. Thử lại sau vài phút.";
  return "Bước này gặp lỗi. Xem log để biết chi tiết.";
}

// ------------------------------------------------------------------ routing
const PAGES = { collect:"Thu thập demo", data:"Chọn dataset", distill:"Distill", models:"Model và chạy robot", settings:"Cài đặt model thầy" };
function route() {
  const h = location.hash.slice(1), page = PAGES[h] ? h : (S.ds.length ? "data" : "collect");
  document.querySelectorAll(".steps a").forEach(a => a.dataset.step === page ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  $("#title").textContent = PAGES[page]; document.title = PAGES[page] + " · NanoVLA Studio";
  ({collect:viewCollect, data:viewData, distill:viewDistill, models:viewModels, settings:viewSettings})[page]();
  renderChrome();
}
addEventListener("hashchange", route);

// ------------------------------------------------------------------ 1 collect
function portOptions(sel) {
  const ports = S.status?.devices.serial || [];
  return ports.length ? ports.map(p => `<option ${p === sel ? "selected" : ""}>${esc(p)}</option>`).join("") : `<option value="">Chưa thấy thiết bị</option>`;
}
function viewCollect() {
  const ports = S.status?.devices.serial || [], cams = S.status?.devices.cameras || [];
  $("#work").innerHTML = `
  <p class="lead">Điều khiển robot bằng tay leader để làm mẫu tác vụ. Mỗi câu lệnh nên có ít nhất 3 demo, với vị trí vật khác nhau.</p>
  <div class="stack">
  ${ports.length < 2 ? `<div class="note warn" role="alert">Cần cắm cả robot và tay leader qua USB (đang thấy ${ports.length} thiết bị). Trang tự cập nhật khi cắm.</div>` : ""}
  <form class="panel" id="f-collect" novalidate>
    <div class="ph"><div><h2>Tác vụ cần dạy</h2><p>Câu lệnh này cũng là câu sẽ dùng để ra lệnh cho model.</p></div></div>
    <div class="pb"><div class="fields">
      <label class="field wide"><span>Câu lệnh</span><input type="text" id="c-task" required placeholder="vd: pick up the red cup and put it in the box"><small>Tiếng Anh, ngắn, nói rõ vật và đích.</small></label>
      <label class="field"><span>Tên dataset</span><input type="text" id="c-name" required pattern="[A-Za-z0-9_\\-]+" placeholder="vd: cup_to_box"><small>Chữ, số, gạch dưới. Trùng tên thì ghi tiếp.</small></label>
      <label class="field"><span>Số demo</span><input type="number" id="c-eps" min="1" max="200" value="10"></label>
    </div>
    <details class="adv"><summary>Thiết bị và thời gian</summary><div class="fields">
      <label class="field"><span>Robot (follower)</span><select id="c-port">${portOptions(ports[0])}</select></label>
      <label class="field"><span>Tay leader</span><select id="c-lport">${portOptions(ports[1])}</select></label>
      <label class="field"><span>Camera cổ tay</span><input type="number" id="c-wcam" min="0" value="0"><small>${cams.length ? "Tìm thấy: " + cams.map(esc).join(", ") : "Chưa thấy camera"}</small></label>
      <label class="field"><span>Camera tổng quan</span><input type="number" id="c-fcam" min="0" value="2"></label>
      <label class="field"><span>Mỗi demo (giây)</span><input type="number" id="c-eps-s" min="5" value="30"></label>
      <label class="field"><span>Nghỉ giữa demo (giây)</span><input type="number" id="c-reset" min="0" value="10"></label>

function metricRows(m) {
  const rows = [["Trò · cổ tay", m.student?.mae10_arm, ""], ["Thầy · 2 camera", m.teacher?.mae10_arm, "t"]];
  const mx = Math.max(...rows.map(r => r[1] || 0), 0.01) * 1.2;
  return rows.map(([l, v, c]) => `<div class="metric"><span>${l}</span><span class="track" aria-hidden="true"><i class="${c}" style="width:${v == null ? 0 : 100 * v / mx}%"></i></span><span class="v">${deg(v)}</span></div>`).join("");
}

// ------------------------------------------------------------------ activity drawer
let openLog = null;
function openDrawer() { $("#drawer").hidden = false; $("#act").setAttribute("aria-expanded", "true"); renderDrawer(); }
function closeDrawer() { $("#drawer").hidden = true; $("#act").setAttribute("aria-expanded", "false"); }
$("#act").onclick = () => $("#drawer").hidden ? openDrawer() : closeDrawer();
$("#drawer-x").onclick = closeDrawer;
addEventListener("keydown", e => { if (e.key === "Escape" && !$("#drawer").hidden && !$("#dlg").open) closeDrawer(); });
async function renderDrawer() {
  if ($("#drawer").hidden) return;
  const J = S.jobs; let log = "";
  if (openLog) { try { log = (await api("/api/jobs/" + openLog)).log || ""; } catch (e) {} }
  const keepScroll = $("#drawer-body").scrollTop;
  $("#drawer-body").innerHTML = J.length ? J.slice(0, 15).map(j => {
    const live = j.status === "running" || j.status === "queued";
    const badge = {running:'<span class="badge warn">Đang chạy</span>', queued:'<span class="badge">Đang chờ</span>', done:'<span class="badge ok">Xong</span>', failed:'<span class="badge bad">Lỗi</span>', stopped:'<span class="badge">Đã dừng</span>'}[j.status];
    return `<div class="job"><div class="row1"><b>${KIND[j.kind] || j.kind}${j.name ? " · " + esc(j.name) : ""}</b>${badge}</div>
      <div class="hint">${ago(j.started || j.created)}${j.ended && j.started ? " · mất " + dur(j.ended - j.started) : ""}</div>
      ${live || j.status === "failed" ? `<ol class="timeline">${j.stages.map(s => `<li class="${s.status}"><span class="ic" aria-hidden="true">${s.status === "done" ? "✓" : s.status === "failed" ? "!" : ""}</span>
        <span>${STAGE[s.name] || s.name}${s.status === "running" && j.progress ? `<div class="prog"><i style="width:${Math.round(j.progress * 100)}%"></i></div>` : ""}</span>
        <span class="dur">${s.ended && s.started ? dur(s.ended - s.started) : s.status === "running" && s.started ? dur(Date.now() / 1000 - s.started) : ""}</span></li>`).join("")}</ol>` : ""}
      ${j.status === "failed" ? `<div class="note bad" style="margin-top:10px">${friendly(j.error)}</div>` : ""}
      <div class="actions">${j.kind === "distill" && j.status === "done" ? `<a class="btn" href="#models" data-goto="${esc(j.name)}">Xem model</a>` : ""}
        ${live ? `<button class="btn danger" data-stop="${j.id}">Dừng</button>` : ""}${j.status === "failed" || j.status === "stopped" ? `<button class="btn" data-retry="${j.id}">Chạy lại</button>` : ""}
        <button class="btn ghost" data-log="${j.id}" aria-expanded="${openLog === j.id}">${openLog === j.id ? "Ẩn log" : "Xem log"}</button></div>
      ${openLog === j.id ? `<pre class="log">${esc(log.split("\n").slice(-60).join("\n")) || "Chưa có log."}</pre>` : ""}</div>`; }).join("")
    : `<div class="empty"><b>Chưa có hoạt động</b>Ghi demo, distill và chạy robot sẽ hiện ở đây.</div>`;
  $("#drawer-body").scrollTop = keepScroll;
  document.querySelectorAll("[data-goto]").forEach(a => a.onclick = () => { S.selModel = a.dataset.goto; closeDrawer(); });
  document.querySelectorAll("[data-log]").forEach(b => b.onclick = () => { openLog = openLog === b.dataset.log ? null : b.dataset.log; renderDrawer(); });
  document.querySelectorAll("[data-retry]").forEach(b => b.onclick = async () => { try { await post(`/api/jobs/${b.dataset.retry}/retry`); toast("Đã chạy lại"); refresh(); } catch (e) { toast(e.message); } });
  document.querySelectorAll("[data-stop]").forEach(b => b.onclick = () => {
    if (b.dataset.confirm) { post(`/api/jobs/${b.dataset.stop}/stop`).then(() => { toast("Đã dừng"); refresh(); }); return; }
    b.dataset.confirm = 1; b.textContent = "Bấm lần nữa để dừng"; setTimeout(() => { if (b.isConnected) { delete b.dataset.confirm; b.textContent = "Dừng"; } }, 4000); });
}

// ------------------------------------------------------------------ chrome + polling
function renderChrome() {
  const s = S.status, run = S.jobs.filter(j => j.status === "running" || j.status === "queued");
  if (s) {
    const set = (id, cls, txt) => { $("#d-" + id).className = "dot " + cls; $("#t-" + id).textContent = txt; };
    set("teacher", s.teacher ? "ok" : "bad", s.teacher ? "Model thầy sẵn sàng" : "Chưa có model thầy");
    set("gpu", s.gpu_busy ? "warn" : "ok", s.gpu_busy ? "GPU đang bận" : "GPU rảnh");
    const n = s.devices.serial.length; set("robot", n >= 2 ? "ok" : n ? "warn" : "", n >= 2 ? "Robot và leader đã cắm" : n ? "Mới cắm 1 thiết bị" : "Chưa cắm robot");
  }
  $("#sub-data").textContent = S.ds.length ? (S.sel ? nice(S.sel).name : S.ds.length + " dataset") : "Chưa có";
  $("#sub-models").textContent = S.models.length ? S.models.length + " model" : "Chưa có";
  const done = {collect:S.ds.length > 0, data:!!S.sel, distill:S.models.length > 0, models:S.jobs.some(j => j.kind === "run" && j.status === "done")};
  document.querySelectorAll(".steps a").forEach(a => a.querySelector(".n").classList.toggle("done", !!done[a.dataset.step] && !a.hasAttribute("aria-current")));
  const a = $("#act"), bar = a.querySelector(".bar");
  if (run.length) { const j = run[0]; a.classList.add("live"); bar.hidden = false; bar.querySelector("i").style.width = Math.round((j.progress || 0) * 100) + "%";
    $("#act-t").textContent = `${KIND[j.kind]} · ${STAGE[j.stage] || "đang chờ"}${run.length > 1 ? ` (+${run.length - 1})` : ""}`; }
  else { a.classList.remove("live"); bar.hidden = true; const f = S.jobs.find(j => j.status === "failed" && Date.now() / 1000 - (j.ended || 0) < 3600);
    $("#act-t").textContent = f ? "1 tác vụ gặp lỗi" : "Hoạt động"; }
}
async function refresh(full) {
  try {
    const [st, jobs] = await Promise.all([api("/api/status"), api("/api/jobs")]);
    const doneSig = jobs.filter(j => j.status === "done").map(j => j.id).join() + "|" + st.devices.serial.join();
    S.status = st; S.jobs = jobs;
    if (full || doneSig !== refresh.sig) {
      const first = refresh.sig === undefined; refresh.sig = doneSig;
      [S.ds, S.models] = await Promise.all([api("/api/datasets"), api("/api/models")]); S.dsDetail = {};
      if (S.sel && !S.ds.some(d => d.name === S.sel)) S.sel = null;
      if (!first && !document.activeElement?.closest("form")) route();
    }
    renderChrome(); renderDrawer();
  } catch (e) { $("#act-t").textContent = "Mất kết nối máy chủ"; }
}
refresh(true).then(route);
setInterval(refresh, 4000);
</script>
